<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 4: Variables and Conditions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
      <h1 class="text-4xl font-bold mb-8">
        Exercise 4: Variables and Conditions
      </h1>

      <div class="bg-white p-6 rounded-lg shadow-md mb-8">
        <h2 class="text-2xl font-semibold mb-4">Number Guessing Game</h2>
        <div class="space-y-4">
          <p id="message" class="text-lg">
            I'm thinking of a number between 1 and 10...
          </p>
          <div>
            <label class="block text-gray-700 mb-2">Your guess:</label>
            <input type="number" id="guess" class="w-full p-2 border rounded" />
          </div>
          <button
            onclick="checkGuess()"
            class="bg-blue-500 text-white px-4 py-2 rounded"
          >
            Submit Guess
          </button>
          <button
            onclick="startNewGame()"
            class="bg-green-500 text-white px-4 py-2 rounded"
          >
            New Game
          </button>
        </div>
      </div>

      <a href="../index.html" class="text-blue-500 hover:underline"
        >&larr; Back to menu</a
      >
    </div>

    <script>
      // TODO: Complete these functions
      let targetNumber;
      let attempts;

      function startNewGame() {
        targetNumber = Math.floor(Math.random() * 10) + 1;
        // clean old values
        document.getElementById("guess").value = '';
        attempts = 0;
        alert("Guess a number between 1 and 10.");
      }

      function checkGuess() {
        // compare id="guess" value with targetNumber
        const guess = parseInt(document.getElementById("guess").value);
        const message = document.getElementById("message");
        attempts++;
        if (guess === targetNumber) {
          alert("Congratulations! You guessed the correct number! after " + attempts + " attempts.");
        } else if (guess < targetNumber) {
          alert("Too low! Try again.");
        } else {
          alert("Too high! Try again.");
        }
      }

      // Start the game when the page loads
      startNewGame();
    </script>
  </body>
</html>
